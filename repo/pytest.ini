[pytest]
testpaths = tests evals
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke:       requires docker compose up -d
    integration: full pipeline tests (no real network)
    unit:        pure logic tests, no I/O
    deepeval:    requires DeepEval + LLM API keys

# Default: run unit + integration, skip smoke and deepeval
addopts = -m "not smoke and not deepeval" -v --tb=short
