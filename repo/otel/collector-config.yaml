receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: spring-service
          static_configs:
            - targets: ["spring-service:8080"]
          metrics_path: /actuator/prometheus
        - job_name: payment-gateway
          static_configs:
            - targets: ["payment-gateway:9081"]
          metrics_path: /actuator/prometheus

processors:
  batch:
    timeout:     10s
    send_batch_size: 1024

  memory_limiter:
    limit_mib:        512
    spike_limit_mib:  128
    check_interval:   5s

  resource:
    attributes:
      - key:    deployment.environment
        value:  local
        action: upsert
      - key:    service.namespace
        value:  ai-factory
        action: upsert

  # PII redaction — strip common sensitive attribute values from spans
  attributes/redact_pii:
    actions:
      - key:    user.email
        action: delete
      - key:    user.phone
        action: delete
      - key:    request.body
        action: delete
      - key:    http.request.body
        action: delete

connectors:
  # Derives RED metrics (call counts + duration histograms) from every span
  # produced by rag/eval/transform/spring/payment-gateway, broken down by
  # service, span name and a few AI-factory-specific attributes. Exported via
  # the prometheus exporter below as ai_factory_calls_total / ai_factory_duration_*.
  spanmetrics:
    histogram:
      explicit:
        buckets: [10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s, 30s]
    dimensions:
      - name: transform.definition
        default: ""
      - name: transform.engine
        default: ""
      - name: eval.passed
        default: ""
    metrics_flush_interval: 15s

exporters:
  otlp/jaeger:
    endpoint: jaeger:14250
    tls:
      insecure: true

  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: ai_factory

  logging:
    loglevel: warn

  # Uncomment to export to CloudWatch (requires AWS credentials in container)
  # awscloudwatch:
  #   region:     ap-southeast-2
  #   log_group:  /ai-factory/otel
  #   log_stream: collector

service:
  telemetry:
    logs:
      level: warn

  pipelines:
    traces:
      receivers:  [otlp]
      processors: [memory_limiter, attributes/redact_pii, resource, batch]
      exporters:  [otlp/jaeger, spanmetrics, logging]

    metrics:
      receivers:  [otlp, prometheus, spanmetrics]
      processors: [memory_limiter, resource, batch]
      exporters:  [prometheus, logging]

    logs:
      receivers:  [otlp]
      processors: [memory_limiter, attributes/redact_pii, resource, batch]
      exporters:  [logging]
