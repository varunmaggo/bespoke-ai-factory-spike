receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: spring-service
          static_configs:
            - targets: ["spring-service:8080"]
          metrics_path: /actuator/prometheus

processors:
  batch:
    timeout:     10s
    send_batch_size: 1024

  memory_limiter:
    limit_mib:        512
    spike_limit_mib:  128
    check_interval:   5s

  resource:
    attributes:
      - key:    deployment.environment
        value:  local
        action: upsert
      - key:    service.namespace
        value:  ai-factory
        action: upsert

  # PII redaction — strip common sensitive attribute values from spans
  attributes/redact_pii:
    actions:
      - key:    user.email
        action: delete
      - key:    user.phone
        action: delete
      - key:    request.body
        action: delete
      - key:    http.request.body
        action: delete

# Derive RED metrics (rate / errors / duration) from every span so the
# Python services — which export traces only — show up in Prometheus/Grafana
# alongside Spring's actuator metrics. Output: ai_factory_calls_total and
# ai_factory_duration_milliseconds_* labelled by service_name / span_name /
# status_code (the ai_factory_ prefix comes from the prometheus exporter
# namespace below).
connectors:
  spanmetrics:
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s]
    dimensions:
      - name: deployment.environment
    metrics_flush_interval: 15s

exporters:
  otlp/jaeger:
    endpoint: jaeger:14250
    tls:
      insecure: true

  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: ai_factory

  logging:
    loglevel: warn

  # Uncomment to export to CloudWatch (requires AWS credentials in container)
  # awscloudwatch:
  #   region:     ap-southeast-2
  #   log_group:  /ai-factory/otel
  #   log_stream: collector

service:
  telemetry:
    logs:
      level: warn

  pipelines:
    traces:
      receivers:  [otlp]
      processors: [memory_limiter, attributes/redact_pii, resource, batch]
      exporters:  [otlp/jaeger, spanmetrics, logging]

    metrics:
      receivers:  [otlp, prometheus, spanmetrics]
      processors: [memory_limiter, resource, batch]
      exporters:  [prometheus, logging]

    logs:
      receivers:  [otlp]
      processors: [memory_limiter, attributes/redact_pii, resource, batch]
      exporters:  [logging]
