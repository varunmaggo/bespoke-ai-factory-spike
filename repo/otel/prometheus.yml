global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  # Metrics exported by the OTel Collector (all AI Factory services)
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Spring Boot actuator metrics (direct scrape)
  - job_name: spring-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["spring-service:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
