spring:
  application:
    name: legacy-query-service

  # OLD Spring AI config — OpenAI-style properties, experimental namespace
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:changeme}
      model: gpt-3.5-turbo
      temperature: 0.7
      max-tokens: 1024

server:
  port: 8080

# Basic actuator — just health, no prometheus scrape, no OTel
management:
  endpoints:
    web:
      exposure:
        include: health, info

# Legacy keyword search endpoint (Solr/Elasticsearch direct URL)
legacy:
  search:
    url: ${SEARCH_SERVICE_URL:http://localhost:8983/solr/documents/select}
    timeout-ms: 5000
    max-results: 10

logging:
  level:
    com.aifactory: INFO
    org.springframework.ai: DEBUG
