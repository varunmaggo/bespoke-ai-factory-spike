name: Heart On Your Sleeve

on:
  workflow_dispatch: {}

permissions:
  issues: write
  reactions: write

jobs:
  react-and-close:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ACTION_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
    steps:
      - name: Create issue, react ❤️ and close
        uses: actions/github-script@v7
        with:
          github-token: ${{ env.ACTION_TOKEN }}
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Temp reaction issue',
              body: 'Temporary issue created by workflow to add a heart reaction.'
            });
            // add reaction (content can be: +1, -1, laugh, confused, heart, hooray, rocket, eyes)
            await github.rest.reactions.createForIssue({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.data.number, content: 'heart' });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.data.number, state: 'closed' });
