name: YOLO and Pull Shark

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr-and-merge:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ACTION_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure auth for git push
        if: ${{ secrets.PAT_TOKEN != '' }}
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Create branch, commit tiny change and push
        run: |
          set -e
          BRANCH=auto/pr-$(date +%s)
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"
          echo "tiny change $(date)" >> tiny.txt
          git add tiny.txt
          git commit -m "tiny change for badge"
          git push --set-upstream origin "$BRANCH"

      - name: Create PR and merge
        uses: actions/github-script@v7
        with:
          github-token: ${{ env.ACTION_TOKEN }}
          script: |
            const { data: repo } = await github.rest.repos.get({ owner: context.repo.owner, repo: context.repo.repo });
            const defaultBranch = repo.default_branch;
            // find our branch
            const branches = await github.rest.repos.listBranches({ owner: context.repo.owner, repo: context.repo.repo });
            const newBranch = branches.data.find(b => b.name.startsWith('auto/pr-'))?.name;
            if (!newBranch) throw new Error('No auto branch found');
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Auto tiny change',
              head: newBranch,
              base: defaultBranch,
              body: 'Automated PR created to earn YOLO / Pull Shark badge.'
            });
            await github.rest.pulls.merge({ owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.data.number, merge_method: 'merge' });
