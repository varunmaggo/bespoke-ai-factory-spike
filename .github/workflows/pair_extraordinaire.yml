name: Pair Extraordinaire

on:
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  coauth-pr-and-merge:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ACTION_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure auth for git push
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -n "$PAT_TOKEN" ]; then
            git remote set-url origin https://x-access-token:$PAT_TOKEN@github.com/${{ github.repository }}.git
          fi

      - name: Create branch and commit co-authored change
        run: |
          set -e
          BRANCH=auto/coauthor-$(date +%s)
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"
          echo "Co-authored tiny change $(date)" >> coauth.txt
          git add coauth.txt
          git commit -m "Add co-authored change\n\nCo-authored-by: Second Author <second@example.com>"
          git push --set-upstream origin "$BRANCH"

      - name: Create PR and merge
        uses: actions/github-script@v7
        with:
          github-token: ${{ env.ACTION_TOKEN }}
          script: |
            const { data: repo } = await github.rest.repos.get({ owner: context.repo.owner, repo: context.repo.repo });
            const defaultBranch = repo.default_branch;
            const branches = await github.rest.repos.listBranches({ owner: context.repo.owner, repo: context.repo.repo });
            const newBranch = branches.data.find(b => b.name.startsWith('auto/coauthor-'))?.name;
            if (!newBranch) throw new Error('No auto branch found');
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Auto co-authored PR',
              head: newBranch,
              base: defaultBranch,
              body: 'Automated co-authored PR created to earn Pair Extraordinaire badge.'
            });
            await github.rest.pulls.merge({ owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.data.number, merge_method: 'merge' });
