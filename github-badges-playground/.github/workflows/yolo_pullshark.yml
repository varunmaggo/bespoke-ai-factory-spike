name: YOLO and Pull Shark

on:
  workflow_dispatch: {}

jobs:
  create-pr-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Create branch, commit tiny change and push
        run: |
          set -e
          BRANCH=auto/pr-$(date +%s)
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"
          echo "tiny change $(date)" >> tiny.txt
          git add tiny.txt
          git commit -m "tiny change for badge"
          git push --set-upstream origin "$BRANCH"

      - name: Create PR and merge
        uses: actions/github-script@v6
        with:
          script: |
            const { data: repo } = await github.rest.repos.get({ owner: context.repo.owner, repo: context.repo.repo });
            const defaultBranch = repo.default_branch;
            // find our branch
            const branches = await github.rest.repos.listBranches({ owner: context.repo.owner, repo: context.repo.repo });
            const newBranch = branches.data.find(b => b.name.startsWith('auto/pr-'))?.name;
            if (!newBranch) throw new Error('No auto branch found');
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Auto tiny change',
              head: newBranch,
              base: defaultBranch,
              body: 'Automated PR created to earn YOLO / Pull Shark badge.'
            });
            await github.rest.pulls.merge({ owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.data.number, merge_method: 'merge' });
