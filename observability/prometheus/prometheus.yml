# observability/prometheus/prometheus.yml
global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: ai-factory
    environment: local

rule_files:
  - alerts.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: ai-factory-java
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["spring-service:8080"]
    relabel_configs:
      - target_label: service
        replacement:  spring-service

  - job_name: ai-factory-rag
    static_configs:
      - targets: ["rag-service:8001"]
    relabel_configs:
      - target_label: service
        replacement:  rag-service

  - job_name: ai-factory-eval
    static_configs:
      - targets: ["eval-service:8002"]
    relabel_configs:
      - target_label: service
        replacement:  eval-service

  - job_name: ai-factory-transform
    static_configs:
      - targets: ["transform-service:8003"]
    relabel_configs:
      - target_label: service
        replacement:  transform-service
